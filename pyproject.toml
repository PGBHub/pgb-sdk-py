[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgbhub"
version = "1.0.0"
description = "Official Python SDK & CLI for PGBHub Cloud (FastAPI / Pydantic / SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hydratik", email = "engineering@pgbhub.com" }]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://console.pgbhub.com"
Repository = "https://github.com/PGBHub/pgbhub-sdk-py"

[project.scripts]
pgbhub = "pgbhub.cli:main"
