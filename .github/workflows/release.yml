name: Release
# Push a tag like v1.1.0 to publish pgbhub to PyPI. Configure PyPI "trusted
# publishing" for this repository and the "pypi" environment (no token needed).
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: pip install . pytest build
      - run: python -m pytest -q tests
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
